<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RIZZ CRM</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff2d55">

<!-- iOS PWA support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RIZZ">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;color:#fff;max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{padding:16px;border-bottom:1px solid #111;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.progress{height:4px;background:#111;flex-shrink:0}
.bar{height:4px;background:#ff2d55;transition:0.3s}
.list{flex:1;min-height:0;overflow:auto}
.contact{padding:16px;border-bottom:1px solid #111;display:flex;justify-content:space-between;align-items:center}
.contact b{font-size:15px}
.contact span{font-size:12px;color:#888}
.stage-tag{font-size:10px;background:#111;padding:3px 8px;border-radius:20px;color:#ff2d55;white-space:nowrap}
.chat{flex:1;min-height:0;padding:16px;display:none;flex-direction:column;gap:10px}
.bubble{max-width:80%;padding:10px 14px;border-radius:16px;font-size:14px;word-break:break-word}
.me{background:#ff2d55;align-self:flex-end}
.her{background:#111;align-self:flex-start}
.suggest{background:#111;border:1px solid #222;border-radius:16px;padding:12px;margin-top:8px}
input,textarea{background:#111;border:1px solid #222;color:#fff;padding:12px;border-radius:12px;width:100%;outline:none;font-family:inherit}
button.main{background:#ff2d55;color:#fff;border:0;padding:12px 16px;border-radius:12px;font-weight:700;cursor:pointer}
.stages{display:flex;gap:6px;margin:10px 0;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.stages::-webkit-scrollbar{display:none}
.stages button{background:#111;border:1px solid #222;color:#888;padding:6px 10px;border-radius:20px;font-size:11px;white-space:nowrap;cursor:pointer}
.stages button.active{background:#ff2d55;color:#fff}
.mode-badge{font-size:10px;background:#1a1a1a;padding:3px 8px;border-radius:20px;color:#888;margin-left:6px}

/* Mode selection cards */
.modes{padding:20px;display:flex;flex-direction:column;gap:14px;overflow:auto;flex:1;min-height:0}
.mode-card{padding:22px;border-radius:20px;border:1px solid #222;background:linear-gradient(135deg,#0a0a0a,#111);cursor:pointer;transition:0.2s;position:relative;overflow:hidden}
.mode-card:active{transform:scale(0.98)}
.mode-card .emoji{font-size:34px;display:block;margin-bottom:10px}
.mode-card .mname{font-size:20px;font-weight:800;letter-spacing:0.5px}
.mode-card .mdesc{font-size:12.5px;color:#888;margin-top:6px;line-height:1.4}
.mode-card .count{position:absolute;top:20px;right:20px;background:#111;padding:4px 10px;border-radius:20px;font-size:11px;color:#ff2d55;font-weight:700;border:1px solid #222}
.mode-card.crush{border-color:#ff2d55}
.mode-card.crush .mname{color:#ff2d55}
.mode-card.gf{border-color:#ff5c8a}
.mode-card.gf .mname{color:#ff5c8a}
.back-btn{background:#111;border:0;color:#fff;padding:8px 12px;border-radius:20px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:#ff2d55;border:0;color:#fff;font-size:26px;font-weight:300;cursor:pointer;box-shadow:0 4px 20px rgba(255,45,85,0.4);display:none;z-index:10}
.fab.show{display:flex;align-items:center;justify-content:center}

/* Install button */
#installBtn{display:none;position:fixed;bottom:90px;right:24px;padding:12px 18px;border-radius:24px;background:#ff2d55;color:#fff;border:0;font-weight:700;cursor:pointer;box-shadow:0 4px 20px rgba(255,45,85,.4);z-index:20;font-size:13px}
</style>
</head>
<body>

<!-- HOME VIEW (mode selection) -->
<div id="homeView" style="display:flex;flex-direction:column;height:100%;flex:1;min-height:0">
  <header>
    <b>RIZZ.</b>
    <span style="font-size:11px;color:#666">Talking Stage Coach</span>
  </header>
  <div class="modes">
    <div class="mode-card crush" onclick="openMode('crush')">
      <span class="count" id="crushCount">0</span>
      <span class="emoji">🔥</span>
      <div class="mname">CRUSH</div>
      <div class="mdesc">Building the vibe. Ice breakers → Know her → Vibe → The Ask.</div>
    </div>
    <div class="mode-card gf" onclick="openMode('gf')">
      <span class="count" id="gfCount">0</span>
      <span class="emoji">💕</span>
      <div class="mname">GIRLFRIEND</div>
      <div class="mdesc">Flowing conversation with your girl. Daily vibe, flirty, deep talk, repair.</div>
    </div>
  </div>
</div>

<!-- LIST VIEW (girls in selected mode) -->
<div id="listView" style="display:none;flex-direction:column;height:100%;flex:1;min-height:0">
  <header>
    <div style="display:flex;align-items:center;gap:10px">
      <button class="back-btn" onclick="backToHome()">←</button>
      <b id="listTitle">Crush</b>
    </div>
  </header>
  <div class="progress"><div id="pbar" class="bar" style="width:0%"></div></div>
  <div id="contacts" class="list"></div>
</div>

<!-- CHAT VIEW -->
<div id="chatView" class="chat" style="display:none">
  <div style="display:flex;gap:6px;align-items:center;flex-shrink:0">
    <button class="back-btn" onclick="backToList()">←</button>
    <b id="chatName"></b>
    <span id="chatStage" class="stage-tag"></span>
    <span id="chatMode" class="mode-badge"></span>
  </div>
  <div class="stages" id="stageRow"></div>
  <div id="msgs" style="flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch"></div>
  <div style="flex-shrink:0;display:flex;flex-direction:column;gap:8px">
    <textarea id="sheSaid" placeholder="Paste what she said..." rows="2"></textarea>
    <button class="main" onclick="gen()">Generate Rizz ⚡</button>
    <div id="suggest"></div>
  </div>
</div>

<!-- Floating + button -->
<button class="fab" id="fab" onclick="newPerson()">+</button>

<!-- Install button (Android / Desktop Chrome) -->
<button id="installBtn">⬇ Install RIZZ</button>

<script>
let db = JSON.parse(localStorage.getItem('rizz_db')||'{}');
let current = null;
let curStage = 'day1';
let activeMode = 'crush';

const STAGES = {
  crush: [
    {key:'day1', label:'Day 1-2 Ice', prog:25},
    {key:'day2', label:'Day 3-5 Know Her', prog:50},
    {key:'day3', label:'Day 6-10 Vibe', prog:75},
    {key:'day4', label:'Day 11+ Ask', prog:100}
  ],
  gf: [
    {key:'daily', label:'Daily Vibe', prog:25},
    {key:'flirty', label:'Flirty', prog:50},
    {key:'deep', label:'Deep Talk', prog:75},
    {key:'repair', label:'Miss Her / Repair', prog:100}
  ]
};

function stagesFor(mode){ return STAGES[mode] || STAGES.crush; }
function defaultStage(mode){ return mode === 'gf' ? 'daily' : 'day1'; }
function getPersonMode(name){ return (db[name] && db[name].mode) || 'crush'; }

function save(){
  localStorage.setItem('rizz_db', JSON.stringify(db));
  refreshCounts();
  if (document.getElementById('listView').style.display === 'flex') renderContacts();
}

// ---------- HOME ----------
function refreshCounts(){
  let c = 0, g = 0;
  for (let n in db){ if ((db[n].mode||'crush') === 'gf') g++; else c++; }
  document.getElementById('crushCount').innerText = c;
  document.getElementById('gfCount').innerText = g;
}

function openMode(mode){
  activeMode = mode;
  document.getElementById('homeView').style.display = 'none';
  document.getElementById('listView').style.display = 'flex';
  document.getElementById('listTitle').innerText = mode === 'gf' ? '💕 Girlfriends' : '🔥 Crushes';
  document.getElementById('pbar').style.width = mode === 'gf' ? '50%' : '25%';
  document.getElementById('pbar').style.background = mode === 'gf' ? '#ff5c8a' : '#ff2d55';
  document.getElementById('fab').classList.add('show');
  renderContacts();
}

function backToHome(){
  document.getElementById('listView').style.display = 'none';
  document.getElementById('homeView').style.display = 'flex';
  document.getElementById('fab').classList.remove('show');
  refreshCounts();
}

function backToList(){
  document.getElementById('chatView').style.display = 'none';
  document.getElementById('listView').style.display = 'flex';
  document.getElementById('fab').classList.add('show');
  current = null;
  renderContacts();
}

// ---------- CONTACTS ----------
function newPerson(){
  let name = prompt(activeMode === 'gf' ? "Her name (girlfriend)?" : "Her name (crush)?");
  if(!name || !name.trim()) return;
  name = name.trim();

  if (db[name]) { alert("Name already used. Pick another."); return; }

  db[name] = {
    stage: defaultStage(activeMode),
    mode: activeMode,
    chats: [],
    created: Date.now()
  };
  save(); openChat(name);
}

function renderContacts(){
  let html = '';
  for (let name in db){
    if ((db[name].mode||'crush') !== activeMode) continue;
    let p = db[name];
    let stgs = stagesFor(activeMode);
    let prog = (stgs.find(s=>s.key===p.stage)||stgs[0]).prog;
    let last = p.chats.slice(-1)[0];
    html += `<div class="contact" onclick="openChat('${name.replace(/'/g,"\\'")}')">
      <div style="flex:1;min-width:0">
        <b>${name}</b><br>
        <span>${last ? last.her : 'No chat yet'}</span>
      </div>
      <div class="stage-tag">${p.stage} • ${prog}%</div>
    </div>`;
  }
  if (!html) html = `<p style="padding:40px;color:#555;text-align:center">No ${activeMode === 'gf' ? 'girlfriends' : 'crushes'} yet.<br>Tap + to add one.</p>`;
  document.getElementById('contacts').innerHTML = html;
}

// ---------- CHAT ----------
function openChat(name){
  current = name;
  curStage = db[name].stage;
  document.getElementById('listView').style.display = 'none';
  document.getElementById('chatView').style.display = 'flex';
  document.getElementById('fab').classList.remove('show');
  document.getElementById('chatName').innerText = name;
  buildStageRow();
  updateStageUI();
  renderMsgs();
}

function buildStageRow(){
  let mode = getPersonMode(current);
  let stgs = stagesFor(mode);
  document.getElementById('stageRow').innerHTML = stgs.map(s =>
    `<button onclick="setStage('${s.key}')" id="stg_${s.key}">${s.label}</button>`
  ).join('');
}

function setStage(s){
  curStage = s;
  db[current].stage = s;
  save(); updateStageUI();
}

function updateStageUI(){
  let mode = getPersonMode(current);
  let stgs = stagesFor(mode);
  document.querySelectorAll('.stages button').forEach(b=>b.classList.remove('active'));
  let btn = document.getElementById('stg_'+curStage);
  if (btn) btn.classList.add('active');
  document.getElementById('chatStage').innerText = curStage;
  document.getElementById('chatMode').innerText = mode === 'gf' ? '💕 GF' : 'CRUSH';
  let prog = (stgs.find(s=>s.key===curStage)||stgs[0]).prog;
  document.getElementById('pbar').style.width = prog + '%';
  document.getElementById('pbar').style.background = mode === 'gf' ? '#ff5c8a' : '#ff2d55';
}

function renderMsgs(){
  let msgs = db[current].chats.map(c =>
    `<div class="bubble her">${c.her}</div><div class="bubble me">${c.me}</div>`
  ).join('');
  document.getElementById('msgs').innerHTML = msgs;
  let box = document.getElementById('msgs');
  setTimeout(()=>{ box.scrollTop = box.scrollHeight; }, 50);
}

// ---------- GENERATE ----------
async function gen(){
  let her = document.getElementById('sheSaid').value.trim();
  if(!her) return;
  let mode = getPersonMode(current);
  document.getElementById('suggest').innerHTML = '<div style="color:#888;font-size:13px;padding:8px">Generating...</div>';
  try{
    let history = db[current].chats || [];
    let res = await fetch('https://rizz-sayitbetter.jdevapphub.workers.dev/',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ sheSaid: her, stage: curStage, mode: mode, history: history })
    });
    let d = await res.json();
    if(!res.ok) throw new Error(d.error || d.message || JSON.stringify(d));
    if(d.error) throw new Error(d.error);
    if(!d.natural) throw new Error("API returned: " + JSON.stringify(d).slice(0,200));

    let labels = mode === 'gf'
      ? {a:'NATURAL', b:'SWEET', c:'DEEP • '}
      : {a:'NATURAL', b:'FUNNY', c:'SMOOTH • '};

    let accent = mode === 'gf' ? '#ff5c8a' : '#ff2d55';

    document.getElementById('suggest').innerHTML = `
      <div class="suggest"><b style="color:${accent};font-size:11px">${labels.a}</b><br>${d.natural} <button onclick="use(this.dataset.txt,this.dataset.her)" data-txt="${(d.natural||'').replace(/"/g,'&quot;')}" data-her="${her.replace(/"/g,'&quot;')}" style="float:right;background:#222;border:0;color:#fff;padding:4px 8px;border-radius:20px;cursor:pointer">USE</button></div>
      <div class="suggest"><b style="color:${accent};font-size:11px">${labels.b}</b><br>${d.funny} <button onclick="use(this.dataset.txt,this.dataset.her)" data-txt="${(d.funny||'').replace(/"/g,'&quot;')}" data-her="${her.replace(/"/g,'&quot;')}" style="float:right;background:#222;border:0;color:#fff;padding:4px 8px;border-radius:20px;cursor:pointer">USE</button></div>
      <div class="suggest" style="border-color:${accent}"><b style="color:${accent};font-size:11px">${labels.c}${curStage}</b><br>${d.smooth} <button onclick="use(this.dataset.txt,this.dataset.her)" data-txt="${(d.smooth||'').replace(/"/g,'&quot;')}" data-her="${her.replace(/"/g,'&quot;')}" style="float:right;background:${accent};border:0;color:#fff;padding:4px 8px;border-radius:20px;cursor:pointer">USE</button><br><small style="color:#666;margin-top:6px;display:block">Tip: ${d.advice||''}</small></div>
    `;
  } catch(e){
    document.getElementById('suggest').innerHTML = '<div style="background:#220000;border:1px solid #550000;padding:12px;border-radius:12px;color:#ff7777;font-size:12px">API Error: '+e.message+'</div>';
    console.error(e);
  }
}

function use(me, her){
  if (!me) return;
  db[current].chats.push({her, me, at: Date.now()});
  save(); renderMsgs();
  document.getElementById('sheSaid').value = '';
  document.getElementById('suggest').innerHTML = '';
  let mode = getPersonMode(current);
  if(mode === 'crush' && db[current].chats.length > 3 && curStage === 'day1'){
    setTimeout(()=>{ setStage('day2'); }, 400);
  }
}

// ---------- INIT ----------
refreshCounts();
</script>

<script>
// Service worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('SW registered:', reg.scope))
      .catch(err => console.error('SW failed:', err));
  });
}

// Install button (Android / Desktop Chrome)
let deferredPrompt;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'block';
});
installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.style.display = 'none';
});
window.addEventListener('appinstalled', () => {
  installBtn.style.display = 'none';
});
</script>
</body>
</html>
